version: '3.9'

services:
  api-gateway_dev:
    profiles: [ "dev" ]
    build:
      context: ./
      dockerfile: docker/backend/dockerfile
      args:
        - path_service_to_build=api-gateway
        - env=development
        - port=3000
    container_name: financial_system_backend_api_gateway_dev
    ports:
      - "3000:3000"
    env_file:
      - .env.development
    networks:
      - financial_system_backend_dev_net
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:${PORT}/health" ]
      interval: 1m30s
      timeout: 30s
      retries: 5
      start_period: 30s


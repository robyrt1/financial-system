version: '3.9'

networks:
  financial_system_backend_dev_net:

services:
  api-gateway-dev:
    profiles: [ "dev" ]
    build:
      context: ./
      dockerfile: docker/backend/dockerfile
      args:
        - path_service_to_build=api-gateway
        - env=development
        - port=${PORT:-4000}
    container_name: financial_system_backend_api_gateway_dev
    ports:
      - "${PORT:-4000}:3000"
    env_file:
      - ./env-files/api-gateway/.env.development
    networks:
      - financial_system_backend_dev_net
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:3000/health" ]
      interval: 1m30s
      timeout: 30s
      retries: 5
      start_period: 30s

  auth-dev:
    profiles: [ "dev" ]
    build:
      context: ./
      dockerfile: docker/backend/dockerfile
      args:
        - path_service_to_build=auth-service
        - env=development
        - port=3001
    container_name: financial_system_backend_auth_dev
    ports:
      - "${PORT:-3001}:3001"
    env_file:
      - ./env-files/auth/.env.development
    networks:
      - financial_system_backend_dev_net
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:${PORT}/health" ]
      interval: 1m30s
      timeout: 30s
      retries: 5
      start_period: 30s

version: '3.9'

networks:
  db-network:
    name: financial-db-net-${NODE_ENV:-dev}
    external: true
  mq-network:
    name: financial-mq-net-${NODE_ENV:-dev}
    external: true
  obs-network:
    name: financial-obs-net-${NODE_ENV:-dev}
    external: true

services:
  rabbitmq-dev:
    profiles: [ "dev" ]
    image: rabbitmq:3.13-management
    container_name: financial_system_backend_rabbitmq_dev
    ports:
      - "5672:5672"
    networks:
      - mq-network
  api-gateway-dev:
    profiles: [ "dev" ]
    build:
      context: ./
      dockerfile: apps/backend/dockerfile
      args:
        - path_service_to_build=api-gateway
        - env=development
        - port=${PORT:-4000}
    container_name: financial_system_backend_api_gateway_dev
    ports:
      - "${PORT:-4000}:3000"
    env_file:
      - ./env-files/api-gateway/.env.development
    environment:
      - OTEL_SERVICE_NAME=api-gateway
      - OTEL_EXPORTER_OTLP_METRICS_ENDPOINT=http://opentelemetry-collector:4318/v1/metrics
      - OTEL_EXPORTER_OTLP_TRACES_ENDPOINT=http://opentelemetry-collector:4318/v1/traces
    networks:
      - db-network
      - mq-network
      - obs-network
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:3000/health" ]
      interval: 1m30s
      timeout: 30s
      retries: 5
      start_period: 30s

  auth-dev:
    profiles: [ "dev" ]
    build:
      context: ./
      dockerfile: apps/backend/dockerfile
      args:
        - path_service_to_build=auth-service
        - env=development
        - port=3001
    container_name: financial_system_backend_auth_dev
    ports:
      - "${PORT:-4001}:3001"
    env_file:
      - ./env-files/auth/.env.development
    environment:
      - OTEL_SERVICE_NAME=auth-service
      - OTEL_EXPORTER_OTLP_METRICS_ENDPOINT=http://opentelemetry-collector:4318/v1/metrics
      - OTEL_EXPORTER_OTLP_TRACES_ENDPOINT=http://opentelemetry-collector:4318/v1/traces
    networks:
      - db-network
      - mq-network
      - obs-network
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:3001/health" ]
      interval: 1m30s
      timeout: 30s
      retries: 5
      start_period: 30s

  financial-dev:
    profiles: [ "dev" ]
    build:
      context: ./
      dockerfile: apps/backend/dockerfile
      args:
        - path_service_to_build=financial-service
        - env=development
        - port=3002
    container_name: financial_system_backend_financial_dev
    ports:
      - "${PORT:-4002}:3002"
    env_file:
      - ./env-files/financial/.env.development
    environment:
      - OTEL_SERVICE_NAME=financial
      - OTEL_EXPORTER_OTLP_METRICS_ENDPOINT=http://opentelemetry-collector:4318/v1/metrics
      - OTEL_EXPORTER_OTLP_TRACES_ENDPOINT=http://opentelemetry-collector:4318/v1/traces
    networks:
      - db-network
      - mq-network
      - obs-network
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:3002/health" ]
      interval: 1m30s
      timeout: 30s
      retries: 5
      start_period: 30s

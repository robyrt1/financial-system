apiVersion: 1

datasources:
  - name: Loki
    type: loki
    uid: fin-loki
    access: proxy
    url: http://loki:3100
    isDefault: false
    version: 1
    editable: true
    jsonData:
      derivedFields:
        - name: TraceID
          matcherRegex: "(?:trace_id|traceId)[\"=:s\\s]+([a-f0-9]+)"
          url: "$${__value.raw}"
          datasourceUid: tempo
        - name: JaegerTraceID
          matcherRegex: "(?:trace_id|traceId)[\"=:s\\s]+([a-f0-9]+)"
          url: "$${__value.raw}"
          datasourceUid: jaeger

  - name: Jaeger
    type: jaeger
    uid: jaeger
    access: proxy
    url: http://jaeger:16686
    isDefault: false
    version: 1
    editable: true
    
  - name: Prometheus
    type: prometheus
    uid: prometheus
    access: proxy
    url: http://prometheus:9090
    jsonData:
      timeInterval: 10s
      exemplarTraceIdDestinations:
        - name: trace_id
          datasourceUid: tempo
        - name: trace_id
          datasourceUid: jaeger
      metricsToLogsV2:
        datasourceUid: fin-loki
    basicAuth: false
    isDefault: true
    version: 1
    editable: true

  - name: Tempo
    type: tempo
    uid: tempo
    access: proxy
    url: http://tempo:3200
    isDefault: false
    version: 1
    editable: true
    jsonData:
      httpMethod: GET
      serviceMap:
        datasourceUid: prometheus
      nodeGraph:
        enabled: true
      search:
        hide: false
      tracesToLogsV2:
        datasourceUid: fin-loki
        spanStartTimeShift: '-5m'
        spanEndTimeShift: '5m'
        filterByTraceID: true
      tracesToMetrics:
        datasourceUid: prometheus
        tags:
          - key: service.name
            value: exported_job


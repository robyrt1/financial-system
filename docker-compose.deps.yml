version: '3.9'

volumes:
  postgres_data_dev:
  postgres_data_test:
  postgres_data_prod:

networks:
  financial_system_backend_dev_net:
  financial_system_backend_test_net:
  financial_system_backend_prod_net:

services:

  #           DEVELOPMENT

  rabbitmq-dev:
    profiles: [ "dev" ]
    image: rabbitmq:3.13-management
    container_name: financial_system_backend_rabbitmq_dev
    ports:
      - "5672:5672"
    networks:
      - financial_system_backend_dev_net
    healthcheck:
      test: [ "CMD-SHELL", "rabbitmq-diagnostics -q ping" ]
      interval: 1m30s
      timeout: 30s
      retries: 5
      start_period: 30s

  financial_system_database_dev:
    profiles: [ "dev" ]
    image: postgres:15
    container_name: financial_system_database_dev
    env_file:
      - .env.development
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-financial_system_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-financial_system_password}
      - POSTGRES_DB=${POSTGRES_DB:-financial_system}
    ports:
      - "5432:${POSTGRES_PORT}"
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
    networks:
      - financial_system_backend_dev_net
    restart: always
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB} -p ${POSTGRES_PORT}" ]
      interval: 1m30s
      timeout: 30s
      retries: 5
      start_period: 30s

  #
  #   TEST
  #


  rabbitmq-test:
    profiles: [ "test" ]
    image: rabbitmq:3.13-management
    container_name: financial_system_backend_rabbitmq_test
    ports:
      - "5672:5672"
    networks:
      - financial_system_backend_test_net
    healthcheck:
      test: [ "CMD-SHELL", "rabbitmq-diagnostics -q ping" ]
      interval: 1m30s
      timeout: 30s
      retries: 5
      start_period: 30s

  financial_system_database_test:
    profiles: [ "test" ]
    image: postgres:15
    container_name: financial_system_database_test
    env_file:
      - .env.test
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-financial_system_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-financial_system_password}
      - POSTGRES_DB=${POSTGRES_DB:-financial_system}
    ports:
      - "5433:${POSTGRES_PORT}"
    volumes:
      - postgres_data_test:/var/lib/postgresql/data
    networks:
      - financial_system_backend_test_net
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB} -p ${POSTGRES_PORT}" ]
      interval: 1m30s
      timeout: 30s
      retries: 5
      start_period: 30s

  #
  #           PRODUÇÃO
  #

  financial_system_database_prod:
    profiles: [ "prod" ]
    image: postgres:15
    container_name: financial_system_database_prod
    env_file:
      - .env.production
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-financial_system_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-financial_system_password}
      - POSTGRES_DB=${POSTGRES_DB:-financial_system}
    ports:
      - "5434:${POSTGRES_PORT}"
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
    networks:
      - financial_system_backend_prod_net
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB} -p ${POSTGRES_PORT}" ]
      interval: 1m30s
      timeout: 30s
      retries: 5
      start_period: 30s

  rabbitmq-prod:
    profiles: [ "prod" ]
    image: rabbitmq:3.13-management
    container_name: financial_system_backend_rabbitmq_prod
    ports:
      - "5672:5672"
    networks:
      - financial_system_backend_prod_net
    healthcheck:
      test: [ "CMD-SHELL", "rabbitmq-diagnostics -q ping" ]
      interval: 1m30s
      timeout: 30s
      retries: 5
      start_period: 30s
